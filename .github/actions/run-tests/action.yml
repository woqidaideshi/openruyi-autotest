name: Run TMT Tests
description: SSH to target, clone repo, install deps, run tmt, collect results

inputs:
  ssh_host:
    description: 'SSH target host'
    required: true
  ssh_port:
    description: 'SSH port'
    required: true
  ssh_user:
    description: 'SSH user'
    required: true
  ssh_pass:
    description: 'SSH password'
    required: true
  result_dir:
    description: 'Local directory for results'
    required: true
  test_plan:
    description: 'tmt plan name'
    required: false
    default: '/plans/smoke'
  test_filter:
    description: 'tmt test --name filter'
    required: false
    default: ''
  github_repo:
    description: 'GitHub repository (owner/name)'
    required: true

runs:
  using: composite
  steps:
    - name: Wait for SSH
      shell: bash
      run: |
        export SSHPASS="${{ inputs.ssh_pass }}"
        echo "Connecting to ${{ inputs.ssh_user }}@${{ inputs.ssh_host }}:${{ inputs.ssh_port }} ..."
        for i in $(seq 1 60); do
          if sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
            -p ${{ inputs.ssh_port }} ${{ inputs.ssh_user }}@${{ inputs.ssh_host }} "echo OK" 2>/dev/null; then
            echo "SSH ready ($i/60)"
            exit 0
          fi
          sleep 10
        done
        echo "ERROR: SSH timeout"
        exit 1

    - name: Run tests on target
      shell: bash
      run: |
        set -o pipefail
        export SSHPASS="${{ inputs.ssh_pass }}"
        SSHO="sshpass -e ssh -o StrictHostKeyChecking=no -p ${{ inputs.ssh_port }} ${{ inputs.ssh_user }}@${{ inputs.ssh_host }}"

        $SSHO "uname -a && free -h && df -lh"
        # Configure passwordless sudo (using SSH password, assuming same as sudo password)
        $SSHO "echo '${{ inputs.ssh_pass }}' | sudo -S sh -c 'echo \"${{ inputs.ssh_user }} ALL=(ALL) NOPASSWD: ALL\" > /etc/sudoers.d/${{ inputs.ssh_user }} && chmod 440 /etc/sudoers.d/${{ inputs.ssh_user }}'"
        $SSHO "sudo dnf install -y --refresh git tmt beakerlib rsync 2>&1"
        $SSHO "tmt --version || echo 'tmt not installed'"
        $SSHO "rm -rf ~/openruyi-autotest ~/results && git clone https://github.com/${{ inputs.github_repo }}.git ~/openruyi-autotest"
        $SSHO "mkdir -p ~/results"

        echo "Plan: ${{ inputs.test_plan }}  Filter: ${{ inputs.test_filter || 'none' }}"

        TMT="cd ~/openruyi-autotest && tmt run -i ~/results --all --verbose plan --name ${{ inputs.test_plan }}"
        [ -n "${{ inputs.test_filter }}" ] && TMT="$TMT test --name ${{ inputs.test_filter }}"
        TMT="$TMT provision --feeling-safe 2>&1"

        echo "Executing: $TMT"
        $SSHO "$TMT" | tee "${{ inputs.result_dir }}/tmt-output.txt"

    - name: Collect results
      shell: bash
      run: |
        export SSHPASS="${{ inputs.ssh_pass }}"
        rsync -avz \
          -e "sshpass -e ssh -o StrictHostKeyChecking=no -p ${{ inputs.ssh_port }}" \
          ${{ inputs.ssh_user }}@${{ inputs.ssh_host }}:~/results/ "${{ inputs.result_dir }}/"

    - name: Summary
      shell: bash
      run: |
        echo "=== Test Summary ==="
        grep -E "pass|fail|error|skip|total|summary" "${{ inputs.result_dir }}/tmt-output.txt" || true
